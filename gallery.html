<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your wedding memory · EverAfter</title><style>body{margin:0;min-height:100vh;background:#ebf0e9;color:#203a3a;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center}main{margin:25px;padding:27px;max-width:435px;background:#fff;border-radius:17px;box-shadow:0 24px 65px #19332925;text-align:center}h1{font:normal 35px Georgia;margin:13px 0}p{font-size:12px;line-height:1.6;color:#77887e}img{width:min(100%,340px);aspect-ratio:2/3;object-fit:contain;background:#f5f0e9;box-shadow:0 10px 30px #19332922}a{display:block;padding:16px;margin:18px 0 0;background:#1d3b3b;border-radius:8px;color:white;text-decoration:none;font-size:12px;font-weight:800}.brand{font:normal 22px Georgia;color:#a58d66}</style></head><body><main><div class="brand">✦ everafter.</div><h1>Your moment, forever.</h1><p>A personalized wedding keepsake, created with permission.</p><img id="picture" alt="Wedding guest photograph"><a id="download" download="EverAfter-Wedding-Photo.jpg">↓ Download photograph</a><p>Private share link. The event's photo retention policy may limit availability. Contact the event operator for removal requests.</p><p id="message"></p></main><script>const p=new URLSearchParams(location.search),id=p.get('id'),t=p.get('t');if(!/^[0-9a-f]{32}$/.test(id||'')||!t){document.getElementById('message').textContent='Invalid private photo link.'}else{const url='/api/gallery/'+id+'/image?t='+encodeURIComponent(t);document.getElementById('picture').src=url;document.getElementById('picture').onerror=()=>{document.getElementById('message').textContent='This photo is no longer available.'};document.getElementById('download').href=url}</script></body></html>
